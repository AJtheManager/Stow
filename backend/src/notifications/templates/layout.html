<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>{{subject}}</title>
    <style>
      body { margin: 0; padding: 0; width: 100% !important; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
      table { border-collapse: collapse; }
      img { border: 0; }
      a { color: #0f766e; }
      @media only screen and (max-width: 480px) {
        .container { width: 100% !important; }
        .px { padding-left: 20px !important; padding-right: 20px !important; }
        .title { font-size: 22px !important; line-height: 28px !important; }
        .amount { font-size: 26px !important; }
        .btn { display: block !important; text-align: center !important; }
        .row-label, .row-value { display: block !important; width: 100% !important; text-align: left !important; }
        .row-value { padding-top: 2px !important; }
      }
    </style>
  </head>
  <body style="margin:0;padding:0;background-color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0f172a;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{{preheader}}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f1f5f9;">
      <tr>
        <td align="center" style="padding:24px 12px;">
          <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:100%;">
            <tr>
              <td class="px" style="background-color:#0b1220;padding:20px 32px;border-radius:12px 12px 0 0;">
                <span style="font-size:22px;font-weight:700;letter-spacing:0.5px;color:#2dd4bf;">Stow</span>
                <span style="font-size:13px;color:#94a3b8;padding-left:8px;">Savings on Stellar</span>
              </td>
            </tr>
            <tr>
              <td class="px" style="background-color:#ffffff;padding:32px;border-left:1px solid #e2e8f0;border-right:1px solid #e2e8f0;">
                {{{content}}}
              </td>
            </tr>
            <tr>
              <td class="px" style="background-color:#f8fafc;padding:20px 32px;border:1px solid #e2e8f0;border-radius:0 0 12px 12px;font-size:12px;line-height:18px;color:#64748b;">
                <p style="margin:0 0 8px 0;">You are receiving this email because you have a Stow account and email notifications are turned on.</p>
                <p style="margin:0;">
                  <a href="{{unsubscribeUrl}}" style="color:#0f766e;text-decoration:underline;">Unsubscribe</a>
                  from Stow emails &middot;
                  <a href="{{appUrl}}" style="color:#0f766e;text-decoration:underline;">Open Stow</a>
                </p>
                <p style="margin:12px 0 0 0;color:#94a3b8;">Stow is non-custodial. We never hold your funds.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
