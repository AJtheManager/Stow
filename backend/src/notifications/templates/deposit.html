<h1 class="title" style="margin:0 0 8px 0;font-size:26px;line-height:32px;font-weight:700;color:#0f172a;">Deposit confirmed</h1>
<p style="margin:0 0 20px 0;font-size:16px;line-height:24px;color:#334155;">Hi {{userName}}, your deposit has been confirmed and is now part of your savings.</p>
<p class="amount" style="margin:0 0 20px 0;font-size:32px;line-height:38px;font-weight:700;color:#0f766e;">{{amount}} {{asset}}</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px 0;border-top:1px solid #e2e8f0;">
  <tr>
    <td class="row-label" style="padding:12px 0;border-bottom:1px solid #e2e8f0;font-size:14px;color:#64748b;">Date</td>
    <td class="row-value" align="right" style="padding:12px 0;border-bottom:1px solid #e2e8f0;font-size:14px;color:#0f172a;">{{date}}</td>
  </tr>
  <tr>
    <td class="row-label" style="padding:12px 0;border-bottom:1px solid #e2e8f0;font-size:14px;color:#64748b;">Transaction</td>
    <td class="row-value" align="right" style="padding:12px 0;border-bottom:1px solid #e2e8f0;font-size:14px;color:#0f172a;word-break:break-all;">{{transactionId}}</td>
  </tr>
</table>
<a class="btn" href="{{appUrl}}" style="display:inline-block;background-color:#0f766e;color:#ffffff;font-size:16px;font-weight:600;line-height:20px;text-decoration:none;padding:14px 28px;border-radius:8px;">View your savings</a>
